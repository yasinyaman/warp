# Auto CRUD API - Database Configuration
# Environment variables can be used with ${VAR_NAME} syntax

databases:
  - name: primary_db
    type: postgresql
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:myapp}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:}
    options:
      pool_size: 10
      pool_max_overflow: 5
      ssl: false

  # MySQL configuration
  - name: mysql_db
    type: mysql
    host: ${MYSQL_HOST:localhost}
    port: ${MYSQL_PORT:3306}
    database: ${MYSQL_DB:testdb}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASS:}
    options:
      pool_size: 10

settings:
  # Automatically discover all tables in the database
  auto_discover_tables: true

  # Tables to exclude from API generation
  excluded_tables:
    - migrations
    - _prisma_migrations
    - alembic_version
    - schema_migrations

  # Pagination settings
  pagination:
    default_limit: 50
    max_limit: 1000

  # Raw query settings
  # Disabled by default. Enabling exposes a raw SQL endpoint — keep it off in
  # production (startup is refused if true while APP_ENV=production), and only
  # ever point it at a read-only database role.
  enable_raw_query: false
  raw_query_whitelist:
    - SELECT
    # Add more allowed SQL commands if needed
    # - INSERT
    # - UPDATE

  # API settings
  api_prefix: /api/v1
  docs_url: /docs
  redoc_url: /redoc

  # Authentication settings
  auth:
    enabled: false
    header_name: X-API-Key
    # Public paths that don't require authentication
    public_paths:
      - /health
      - /docs
      - /redoc
      - /openapi.json
    # API keys with permissions
    # Permissions: read, create, update, delete, query (for raw SQL), all (full access)
    # Keys are supplied via environment variables (see .env.example).
    # No insecure defaults: an unset/empty key cannot authenticate.
    api_keys:
      - key: ${API_KEY_ADMIN:}
        name: admin
        permissions:
          - all
      - key: ${API_KEY_READONLY:}
        name: readonly_user
        permissions:
          - read
      - key: ${API_KEY_WRITER:}
        name: writer_user
        permissions:
          - read
          - create
          - update

  # --- Catalog Intelligence  Settings ---

  # Catalog storage configuration
  catalog:
    storage_path: "./catalogs"
    default_format: "json"        # json or yaml
    auto_cross_reference: true    # Use existing catalogs as context
    auto_enrich_openapi: true     # Auto-enrich /docs with catalog descriptions
    openapi_enrichment_lang: "en" # Language for OpenAPI enrichment

  # Schema analysis configuration
  analysis:
    sample_limit: 5               # Sample rows per table for LLM context
    include_row_count: true       # Include approximate row counts

  # LLM provider configuration
  llm:
    provider: "${LLM_PROVIDER:ollama}"           # openai, anthropic, gemini, ollama
    model: "${LLM_MODEL:gemma3:1b}"
    api_key: "${LLM_API_KEY:}"
    base_url: "${LLM_BASE_URL:http://localhost:11434}"
    temperature: 0.3
    max_tokens: 4096

  # Internationalization
  i18n:
    default_language: "en"
    languages:
      - "en"
    fallback_language: "en"
    auto_translate: true
    translation_strategy: "single"   # single (all langs in one call) or multi (translate after)
