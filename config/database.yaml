# Auto CRUD API - Database Configuration
# Environment variables can be used with ${VAR_NAME} syntax

databases:
  - name: primary_db
    type: postgresql
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:myapp}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:}
    # Optional read-only credentials used only by the raw SQL endpoint.
    # When set, raw queries run as this role so a whitelist bypass cannot write.
    readonly_username: ${DB_READONLY_USER:}
    readonly_password: ${DB_READONLY_PASS:}
    options:
      pool_size: 10
      pool_max_overflow: 5
      ssl: false

  # MySQL configuration
  - name: mysql_db
    type: mysql
    host: ${MYSQL_HOST:localhost}
    port: ${MYSQL_PORT:3306}
    database: ${MYSQL_DB:testdb}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASS:}
    # Optional read-only credentials used only by the raw SQL endpoint.
    readonly_username: ${MYSQL_READONLY_USER:}
    readonly_password: ${MYSQL_READONLY_PASS:}
    options:
      pool_size: 10

  # SQL Server via ODBC (optional). Needs the `odbc` extra and Microsoft's
  # ODBC driver (the Docker image ships it); start a local server with
  # `docker compose --profile mssql up -d` after setting MSSQL_PASS in .env.
  # - name: mssql_db
  #   type: mssql
  #   host: ${MSSQL_HOST:localhost}
  #   port: ${MSSQL_PORT:1433}
  #   database: ${MSSQL_DB:master}
  #   username: ${MSSQL_USER:sa}
  #   password: ${MSSQL_PASS:}
  #   readonly_username: ${MSSQL_READONLY_USER:}
  #   readonly_password: ${MSSQL_READONLY_PASS:}
  #   options:
  #     schema: dbo
  #     trust_server_certificate: true   # the compose container is self-signed
  #     pool_size: 10

settings:
  # Automatically discover all tables in the database
  auto_discover_tables: true

  # Tables to exclude from API generation
  excluded_tables:
    - migrations
    - _prisma_migrations
    - alembic_version
    - schema_migrations

  # Pagination settings
  pagination:
    default_limit: 50
    max_limit: 1000

  # Raw query settings
  # Disabled by default. Enabling exposes a raw SQL endpoint — keep it off in
  # production (startup is refused if true while APP_ENV=production), and only
  # ever point it at a read-only database role.
  enable_raw_query: false
  raw_query_whitelist:
    - SELECT
    # Add more allowed SQL commands if needed
    # - INSERT
    # - UPDATE

  # API settings
  api_prefix: /api/v1
  docs_url: /docs
  redoc_url: /redoc

  # Authentication settings
  auth:
    enabled: false
    header_name: X-API-Key
    # Public paths that don't require authentication. Matching is on path
    # segments ("/docs" also covers "/docs/oauth2-redirect", not "/docsx").
    # NOTE: /openapi.json carries catalog descriptions and x-llm-context. In
    # production, startup is refused while it is public unless
    # allow_public_openapi is set to true.
    public_paths:
      - /health
      - /docs
      - /redoc
      - /openapi.json
    allow_public_openapi: false
    # API keys with permissions
    # Permissions: read, create, update, delete, query (for raw SQL), all (full access)
    # Keys are supplied via environment variables (see .env.example).
    # No insecure defaults: an unset/empty key cannot authenticate.
    api_keys:
      - key: ${API_KEY_ADMIN:}
        name: admin
        permissions:
          - all
      - key: ${API_KEY_READONLY:}
        name: readonly_user
        permissions:
          - read
      - key: ${API_KEY_WRITER:}
        name: writer_user
        permissions:
          - read
          - create
          - update

  # --- Catalog Intelligence  Settings ---

  # Catalog storage configuration
  catalog:
    storage_path: "./catalogs"
    default_format: "json"        # json or yaml
    auto_cross_reference: true    # Use existing catalogs as context
    auto_enrich_openapi: true     # Auto-enrich /docs with catalog descriptions
    openapi_enrichment_lang: "en" # Language for OpenAPI enrichment
    # Write real sample values from the database into the OpenAPI spec
    # (example/examples/x-llm-context.examples). Off by default: the spec may
    # be reachable without a key and samples can contain sensitive data.
    openapi_include_examples: false

  # Schema analysis configuration
  analysis:
    sample_limit: 5               # Sample rows per table for LLM context
    include_row_count: true       # Include approximate row counts

  # LLM provider configuration
  llm:
    provider: "${LLM_PROVIDER:ollama}"           # openai, anthropic, gemini, ollama
    model: "${LLM_MODEL:gemma3:1b}"
    api_key: "${LLM_API_KEY:}"
    base_url: "${LLM_BASE_URL:http://localhost:11434}"
    temperature: 0.3
    max_tokens: 4096

  # Internationalization
  i18n:
    default_language: "en"
    languages:
      - "en"
    fallback_language: "en"
    auto_translate: true
    translation_strategy: "single"   # single (all langs in one call) or multi (translate after)
