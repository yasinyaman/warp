name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needs write access to publish the generated site to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up uv + Python (activated venv)
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements.lock
      - name: Install (hash-verified lock, includes the docs extra)
        run: |
          uv pip sync --require-hashes requirements.lock
          uv pip install --no-deps -e .
      - name: Build & deploy to gh-pages
        run: mkdocs gh-deploy --force --strict
