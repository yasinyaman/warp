name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default token for every job.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv + Python (activated venv)
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements.lock
      - name: Install (hash-verified lock)
        run: |
          uv pip sync --require-hashes requirements.lock
          uv pip install --no-deps -e .
      - name: Run tests + coverage gate (fail under 80%)
        run: pytest --cov=src/warp --cov-report=term-missing

  integration:
    name: integration (PostgreSQL + MySQL + SQL Server + Oracle via testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv + Python (activated venv)
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements.lock
      - name: Install (hash-verified lock)
        run: |
          uv pip sync --require-hashes requirements.lock
          uv pip install --no-deps -e .
      - name: Install Microsoft ODBC Driver 18 for SQL Server
        run: |
          curl -sSL -o /tmp/packages-microsoft-prod.deb \
            "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          odbcinst -q -d -n "ODBC Driver 18 for SQL Server"
      - name: Install Oracle Instant Client ODBC driver
        run: |
          sudo apt-get install -y libaio1t64 unzip
          # libaio.so.1 is what Instant Client links against; Ubuntu 24.04
          # ships the t64 rebuild under a different soname.
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 \
            /usr/lib/x86_64-linux-gnu/libaio.so.1 || true
          base="https://download.oracle.com/otn_software/linux/instantclient/2360000"
          curl -sSLo /tmp/ic-basic.zip "$base/instantclient-basiclite-linux.x64-23.6.0.24.10.zip"
          curl -sSLo /tmp/ic-odbc.zip  "$base/instantclient-odbc-linux.x64-23.6.0.24.10.zip"
          sudo mkdir -p /opt/oracle
          sudo unzip -q -o /tmp/ic-basic.zip -d /opt/oracle
          sudo unzip -q -o /tmp/ic-odbc.zip -d /opt/oracle
          ic_dir=$(find /opt/oracle -maxdepth 1 -name 'instantclient_*' | head -1)
          echo "$ic_dir" | sudo tee /etc/ld.so.conf.d/oracle-instantclient.conf >/dev/null
          sudo ldconfig
          sudo tee -a /etc/odbcinst.ini >/dev/null <<EOF

          [Oracle 23 ODBC driver]
          Description = Oracle ODBC driver for Oracle 23
          Driver = $ic_dir/libsqora.so.23.1
          FileUsage = 1
          EOF
          odbcinst -q -d -n "Oracle 23 ODBC driver"
      - name: Run integration tests against real databases
        # The SQL Server and Oracle containers/drivers must work here; the
        # suite only auto-skips them on developer machines without them.
        run: pytest tests/integration -m integration
        env:
          WARP_REQUIRE_MSSQL: "1"
          WARP_REQUIRE_ORACLE: "1"

  quality:
    name: lint, format & types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv + Python (activated venv)
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements.lock
      - name: Install (hash-verified lock)
        run: |
          uv pip sync --require-hashes requirements.lock
          uv pip install --no-deps -e .
      - name: Ruff (lint)
        run: ruff check src/ tests/
      - name: Ruff (format)
        run: ruff format --check src/ tests/
      - name: Import contracts (layered architecture)
        run: lint-imports
      - name: Mypy (strict)
        run: mypy src/

  security:
    name: dependency audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv + Python (activated venv)
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements.lock
      - name: pip-audit against the hashed lock
        run: |
          uv pip install pip-audit
          pip-audit --strict --require-hashes -r requirements.lock
        continue-on-error: true
