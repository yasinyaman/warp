name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default token for every job.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install project
        run: uv pip install --system -e ".[dev,llm]"
      - name: Run tests (blocking)
        run: pytest -q
      - name: Coverage report (non-blocking; target ≥80%)
        run: pytest --cov=src/warp --cov-report=term-missing
        continue-on-error: true

  quality:
    name: lint & type-check (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install project
        run: uv pip install --system -e ".[dev,llm]"
      - name: Ruff
        run: ruff check src/ tests/
      - name: Import contracts (layered architecture)
        run: lint-imports
      # mypy --strict does not yet pass cleanly; reported but non-blocking.
      # Flip continue-on-error to false once the backlog is cleared.
      - name: Mypy (strict)
        run: mypy src/
        continue-on-error: true

  security:
    name: dependency audit (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install project
        run: uv pip install --system -e ".[llm]"
      - name: pip-audit
        run: |
          uv pip install --system pip-audit
          pip-audit --strict
        continue-on-error: true
