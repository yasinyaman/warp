[project]
name = "warp-engine"
version = "0.9.0"
description = "Auto-discovery REST CRUD API generator from database schema"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Yasin Yaman", email = "yasnyaman@gmail.com" }
]
keywords = [
    "fastapi",
    "crud",
    "rest-api",
    "database",
    "postgresql",
    "mysql",
    "auto-generate",
    "schema-discovery"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "asyncpg>=0.29.0",
    "aiomysql>=0.2.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "google-genai>=1.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-randomly>=3.15.0",
    "httpx>=0.26.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "import-linter>=2.0",
    "types-PyYAML>=6.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/yasinyaman/warp"
Documentation = "https://github.com/yasinyaman/warp#readme"
Repository = "https://github.com/yasinyaman/warp"
Issues = "https://github.com/yasinyaman/warp/issues"

[project.scripts]
warp = "warp.main:main"
warp-catalog = "warp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/config",
]

# ===========================================
# Tool Configurations
# ===========================================

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".hatch",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "__pycache__",
    "dist",
]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "D",      # pydocstyle
    "PL",     # pylint
    "C901",   # mccabe complexity
    # ARG (flake8-unused-arguments) intentionally omitted: this codebase is
    # built on FastAPI handlers, an LLM provider interface, abstract DB adapters
    # and test mocks whose signatures are contract-imposed, so it fires almost
    # entirely on false positives.
]
ignore = [
    "E501",     # line too long (handled by ruff format)
    "B008",     # do not perform function calls in argument defaults
    "PLC0415",  # import-outside-top-level: intentional here for lazy-importing
                # optional LLM SDKs (openai/anthropic/google-genai) and uvicorn.
    "PLR2004",  # magic-value-comparison: mostly HTTP status codes and length/
                # truncation thresholds here; low value, high noise.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-statements = 60
max-returns = 8

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__
"tests/**" = ["D", "PL", "C901"]  # tests don't need docstrings/complexity rules

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "aiomysql.*",
    "pymysql.*",
    "openai.*",
    "anthropic.*",
    "google.genai.*",
    "google.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-ra",
]

[tool.coverage.run]
source = ["src/warp"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
fail_under = 80

# ===========================================
# Import Linter - hexagonal architecture contracts (ADR-0007)
#
# Layers (top -> bottom): entrypoints/infrastructure > adapters > application
# > domain. The full `layers` contract lands with the ports/composition-root
# commit; until then the domain contracts below are enforced.
# ===========================================

[tool.importlinter]
root_package = "warp"
include_external_packages = true

# Entry points and the composition root sit on top; adapters may only reach
# down into the application and domain; the application knows nothing about
# adapters; the domain knows nothing about anything.
[[tool.importlinter.contracts]]
name = "hexagonal layers"
type = "layers"
layers = [
    "warp.main | warp.cli",
    "warp.infrastructure",
    "warp.adapters",
    "warp.application",
    "warp.domain",
]

[[tool.importlinter.contracts]]
name = "inbound and outbound adapters are independent"
type = "independence"
modules = ["warp.adapters.inbound", "warp.adapters.outbound"]

[[tool.importlinter.contracts]]
name = "http and cli adapters are independent"
type = "independence"
modules = ["warp.adapters.inbound.http", "warp.adapters.inbound.cli"]

[[tool.importlinter.contracts]]
name = "domain is framework-free and imports nothing above it"
type = "forbidden"
source_modules = ["warp.domain"]
forbidden_modules = [
    "fastapi", "starlette", "click", "asyncpg", "aiomysql", "pymysql",
    "openai", "anthropic", "google", "httpx", "yaml", "uvicorn", "dotenv",
    "warp.application", "warp.adapters", "warp.infrastructure",
]

[[tool.importlinter.contracts]]
name = "application depends only on domain and its own ports (no adapters, no frameworks)"
type = "forbidden"
source_modules = ["warp.application"]
forbidden_modules = [
    "fastapi", "starlette", "click", "asyncpg", "aiomysql", "pymysql",
    "openai", "anthropic", "google", "httpx", "yaml", "uvicorn", "dotenv",
    "warp.adapters", "warp.infrastructure",
]
