# Warp Engine - Docker Compose for Development
#
# Secrets are read from a local `.env` file (copy `.env.example` -> `.env`).
# `.env` is gitignored and must never be committed.

services:
  # ===================
  # Application Service
  # ===================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warp-api
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    # Credentials and API/LLM keys come from .env (see .env.example).
    # Optional so a missing .env surfaces the explicit ${DB_PASS:?...} guard
    # below rather than a generic "env file not found" error.
    env_file:
      - path: .env
        required: false
    environment:
      # Non-secret runtime / network-topology overrides. These take precedence
      # over env_file so the container always reaches the compose service names.
      - APP_ENV=development
      - LOG_LEVEL=DEBUG
      - CONFIG_PATH=/app/config/database.yaml
      - PYTHONPATH=/app/src
      - DB_HOST=postgres
      - DB_PORT=5432
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MSSQL_HOST=mssql
      - MSSQL_PORT=1433
    # Dev-only hot-reload against the mounted ./src (the prod image has no --reload).
    command: ["uvicorn", "warp.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - warp-network
    restart: unless-stopped

  # ===================
  # PostgreSQL Database
  # ===================
  postgres:
    image: postgres:16-alpine
    container_name: warp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS is not set — copy .env.example to .env and set it}
      POSTGRES_DB: ${DB_NAME:-testdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-scripts/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-testdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - warp-network
    restart: unless-stopped

  # ===================
  # MySQL Database
  # ===================
  mysql:
    image: mysql:8.0
    container_name: warp-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASS:?MYSQL_PASS is not set — copy .env.example to .env and set it}
      MYSQL_DATABASE: ${MYSQL_DB:-testdb}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init-scripts/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - warp-network
    restart: unless-stopped

  # ===================
  # SQL Server (optional): docker compose --profile mssql up -d
  # ===================
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: warp-mssql
    profiles: ["mssql"]
    # The image is x86-64 only. On Apple Silicon enable Rosetta in Docker
    # Desktop (Settings > General > "Use Rosetta for x86_64/amd64 emulation").
    platform: linux/amd64
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      # Required when the profile is enabled (SQL Server enforces a strong
      # password); left empty otherwise so the default stack still starts.
      MSSQL_SA_PASSWORD: ${MSSQL_PASS:-}
      MSSQL_PID: Developer
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - warp-network
    restart: unless-stopped

  # ===================
  # Oracle (optional): docker compose --profile oracle up -d
  # ===================
  oracle:
    # Oracle's own image needs a licence click-through; gvenzl/oracle-free is
    # the community build, and unlike SQL Server it has arm64 images, so this
    # runs natively on Apple Silicon.
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: warp-oracle
    profiles: ["oracle"]
    ports:
      - "1521:1521"
    environment:
      # Required when the profile is enabled; left empty otherwise so the
      # default stack still starts.
      ORACLE_PASSWORD: ${ORACLE_PASS:-}
      APP_USER: ${ORACLE_USER:-warp}
      APP_USER_PASSWORD: ${ORACLE_PASS:-}
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - warp-network
    restart: unless-stopped

  # ===================
  # Adminer (DB Admin UI)
  # ===================
  adminer:
    image: adminer:latest
    container_name: warp-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
      - mysql
    networks:
      - warp-network
    restart: unless-stopped

networks:
  warp-network:
    driver: bridge

volumes:
  postgres_data:
  mysql_data:
  mssql_data:
  oracle_data:
