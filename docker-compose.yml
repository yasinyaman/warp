# Warp Engine - Docker Compose for Development
#
# Secrets are read from a local `.env` file (copy `.env.example` -> `.env`).
# `.env` is gitignored and must never be committed.

services:
  # ===================
  # Application Service
  # ===================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warp-api
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    # Credentials and API/LLM keys come from .env (see .env.example).
    # Optional so a missing .env surfaces the explicit ${DB_PASS:?...} guard
    # below rather than a generic "env file not found" error.
    env_file:
      - path: .env
        required: false
    environment:
      # Non-secret runtime / network-topology overrides. These take precedence
      # over env_file so the container always reaches the compose service names.
      - APP_ENV=development
      - LOG_LEVEL=DEBUG
      - CONFIG_PATH=/app/config/database.yaml
      - PYTHONPATH=/app/src
      - DB_HOST=postgres
      - DB_PORT=5432
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
    # Dev-only hot-reload against the mounted ./src (the prod image has no --reload).
    command: ["uvicorn", "warp.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - warp-network
    restart: unless-stopped

  # ===================
  # PostgreSQL Database
  # ===================
  postgres:
    image: postgres:16-alpine
    container_name: warp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS is not set — copy .env.example to .env and set it}
      POSTGRES_DB: ${DB_NAME:-testdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-scripts/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-testdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - warp-network
    restart: unless-stopped

  # ===================
  # MySQL Database
  # ===================
  mysql:
    image: mysql:8.0
    container_name: warp-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASS:?MYSQL_PASS is not set — copy .env.example to .env and set it}
      MYSQL_DATABASE: ${MYSQL_DB:-testdb}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init-scripts/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - warp-network
    restart: unless-stopped

  # ===================
  # Adminer (DB Admin UI)
  # ===================
  adminer:
    image: adminer:latest
    container_name: warp-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
      - mysql
    networks:
      - warp-network
    restart: unless-stopped

networks:
  warp-network:
    driver: bridge

volumes:
  postgres_data:
  mysql_data:
